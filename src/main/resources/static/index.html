<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dating Profile Creator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 0.5rem;
            font-size: 1.75rem;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-weight: 600;
            color: #444;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
        }

        input, textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .char-count {
            text-align: right;
            font-size: 0.8rem;
            color: #999;
            margin-top: 0.25rem;
        }

        button {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            margin-top: 0.5rem;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .success-view {
            display: none;
            text-align: center;
            padding: 2rem 0;
        }

        .success-view .checkmark {
            font-size: 5rem;
            margin-bottom: 1rem;
        }

        .success-view h2 {
            color: #166534;
            margin-bottom: 0.5rem;
        }

        .success-view p {
            color: #333;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 0.25rem;
        }

        .success-view .profile-id {
            color: #999;
            font-size: 0.8rem;
            margin-top: 0.75rem;
        }

        .btn-back {
            margin-top: 1.5rem;
            display: inline-block;
            padding: 0.75rem 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            width: auto;
        }

        .btn-back:hover {
            opacity: 0.9;
        }

        .error-banner {
            display: none;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 1rem 1.25rem;
            border-radius: 8px;
            margin-bottom: 1.25rem;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .error-banner strong {
            display: block;
            margin-bottom: 0.25rem;
        }

        .categories {
            margin-top: 0.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .category-tag {
            background: #fee2e2;
            color: #991b1b;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }


        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- FORM VIEW -->
    <div id="formView">
        <h1>💕 Create Profile</h1>
        <p class="subtitle">Your bio will be reviewed by AI moderation</p>

        <div id="errorBanner" class="error-banner"></div>

        <form id="profileForm">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" name="age" min="18" max="120" placeholder="Your age" required>
            </div>

            <div class="form-group">
                <label for="bio">Bio</label>
                <textarea id="bio" name="bio" maxlength="1000" placeholder="Tell us about yourself..." required></textarea>
                <div class="char-count"><span id="charCount">0</span>/1000</div>
            </div>

            <button type="submit" id="submitBtn">Create Profile</button>
        </form>
    </div>

    <!-- SUCCESS VIEW -->
    <div id="successView" class="success-view">
        <div class="checkmark">✅</div>
        <h2>Profile Created!</h2>
        <div id="successDetails"></div>
        <button class="btn-back" id="backBtn">← Back to Home</button>
    </div>
</div>

<script>
    const form = document.getElementById('profileForm');
    const bioInput = document.getElementById('bio');
    const charCount = document.getElementById('charCount');
    const submitBtn = document.getElementById('submitBtn');
    const formView = document.getElementById('formView');
    const successView = document.getElementById('successView');
    const successDetails = document.getElementById('successDetails');
    const errorBanner = document.getElementById('errorBanner');
    const backBtn = document.getElementById('backBtn');

    bioInput.addEventListener('input', () => {
        charCount.textContent = bioInput.value.length;
    });

    backBtn.addEventListener('click', () => {
        successView.style.display = 'none';
        formView.style.display = 'block';
        form.reset();
        charCount.textContent = '0';
        errorBanner.style.display = 'none';
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span>Checking with AI...';
        errorBanner.style.display = 'none';

        const payload = {
            name: document.getElementById('name').value,
            age: parseInt(document.getElementById('age').value),
            bio: bioInput.value
        };

        try {
            const response = await fetch('/profiles', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.status === 201) {
                formView.style.display = 'none';
                successView.style.display = 'block';
                successDetails.innerHTML = `
                    <p><strong>${data.displayName}</strong>, ${data.age}</p>
                    <p>${data.bio}</p>
                    <p class="profile-id">ID: ${data.id}</p>
                `;
            } else {
                const categoriesHtml = (data.categories || [])
                    .map(c => `<span class="category-tag">${c.replace(/_/g, ' ')}</span>`)
                    .join('');
                errorBanner.innerHTML = `
                    <strong>⚠️ Content not allowed</strong>
                    ${data.message}
                    ${categoriesHtml ? `<div class="categories">${categoriesHtml}</div>` : ''}
                `;
                errorBanner.style.display = 'block';
            }
        } catch (err) {
            errorBanner.innerHTML = `<strong>⚠️ Error</strong>${err.message}`;
            errorBanner.style.display = 'block';
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Create Profile';
        }
    });
</script>
</body>
</html>
